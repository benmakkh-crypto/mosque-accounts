<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>حسابات الجوامع — بنجلاديش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* لوحة دفتر حسابات: شريط علوي ثابت ← تبويبات ← سطح العمل. يدعم RTL و LTR */
:root{
  --bg:#f4f6f3; --surface:#fff; --sunk:#e9eee9; --line:#d5ddd6; --fg:#17231d; --muted:#5d6e64;
  --ink:#0d5a48; --ink-soft:#d9ebe4; --on-ink:#fff;
  --ok:#1f7a45; --ok-bg:#e1f2e7; --warn:#9a5b00; --warn-bg:#fbefd8; --bad:#b3261e; --bad-bg:#fbe3e1;
  --m1:#0d5a48; --m2:#2f6fa6; --m3:#8a5a12; --m4:#7a3e78;
  --f-display:"Noto Kufi Arabic","IBM Plex Sans Arabic","Hind Siliguri",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Hind Siliguri",Tahoma,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1613; --surface:#16201b; --sunk:#1c2822; --line:#2b3a32; --fg:#e4ece7; --muted:#97a89e;
  --ink:#4fbf9c; --ink-soft:#1d3a31; --on-ink:#06261d;
  --ok:#6fd39a; --ok-bg:#163223; --warn:#f0b75e; --warn-bg:#3a2a10; --bad:#ff8a80; --bad-bg:#3d1a17;
  --m1:#4fbf9c; --m2:#78aee0; --m3:#d9a654; --m4:#cf8ccc; color-scheme:dark}}
html[lang="bn"]{--f-body:"Hind Siliguri","IBM Plex Sans Arabic",sans-serif;--f-display:"Hind Siliguri",sans-serif}
html[lang="en"]{--f-body:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;--f-display:"IBM Plex Sans Arabic",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
h1{font-family:var(--f-display);font-size:1.25rem;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,select,input,textarea{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row-flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:.88rem;display:inline-flex;align-items:center;gap:6px}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 10px;cursor:pointer;font-size:.85rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:10px 14px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:500}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--ink)}
main .wrap{padding-block:20px 60px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sec-h{font-family:var(--f-display);font-size:1.02rem;margin:0}
.ph{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.mcard{padding:16px;display:flex;flex-direction:column;gap:12px;border-top:4px solid var(--mc)}
.mcard h3{margin:0;font-family:var(--f-display);font-size:1.05rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.9rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:end}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.mute{background:var(--sunk);color:var(--muted)}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.totals div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.totals .lbl{font-size:.8rem;color:var(--muted)} .totals .val{font-size:1.15rem;font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px}
.toolbar input[type=search]{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.toolbar select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px}
.tog{display:inline-flex;gap:6px;align-items:center;font-size:.88rem;color:var(--muted);cursor:pointer}
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--sunk);white-space:nowrap}
.amt{text-align:end}
tbody tr.row{cursor:pointer} tbody tr.row:hover{background:var(--sunk)}
tr.flag td:first-child{box-shadow:inset -3px 0 0 var(--warn)}
html[dir="ltr"] tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
tfoot td{font-weight:700;background:var(--sunk)}
.mtag{display:inline-block;padding:0 7px;border-radius:5px;font-size:.75rem;font-weight:600;color:var(--surface);background:var(--mc)}
.muted{color:var(--muted)} .small{font-size:.8rem}
.empty{padding:28px;text-align:center;color:var(--muted)}
.notice{padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-size:.9rem}
.notice.info{background:var(--ink-soft);color:var(--fg)}
dialog{border:0;border-radius:14px;padding:0;width:min(660px,calc(100vw - 24px));background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog.wide{width:min(900px,calc(100vw - 24px))}
dialog::backdrop{background:rgba(10,20,15,.5)}
dialog form,dialog .dbody{display:flex;flex-direction:column;gap:14px;padding:20px;max-height:86vh;overflow:auto}
dialog h2{margin:0;font-family:var(--f-display);font-size:1.1rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.82rem;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;width:100%}
.field input:disabled,.field select:disabled,.field textarea:disabled{opacity:.75}
.field .hint{font-size:.76rem;color:var(--muted)}
.field.req label::after{content:" *";color:var(--bad)}
fieldset.box{border:1px dashed var(--ink);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;margin:0}
fieldset.box legend{padding:0 6px;font-weight:600;color:var(--ink)}
.thumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thumb img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.actions .r{display:flex;gap:8px}
.err{color:var(--bad);font-size:.88rem}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:20}
.pager{display:flex;justify-content:center;padding:12px}
table.inst td{padding:4px}
table.inst input,table.inst select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px;width:100%;min-width:90px}
.mis{padding:14px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--mc)}
.mis h4{margin:0;font-size:1rem}
.steps{display:flex;flex-wrap:wrap;gap:4px}
.step{font-size:.72rem;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.step.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.step.progress{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.note{padding:14px;display:flex;flex-direction:column;gap:6px;border-inline-start:4px solid var(--mc)}
.note.done{opacity:.6}
.note .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.note p{margin:0;white-space:pre-wrap}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:min(420px,100%);padding:28px;display:flex;flex-direction:column;gap:16px}
.login h1{font-size:1.4rem}
.login input{font-size:1.2rem;letter-spacing:.15em;text-align:center;direction:ltr}
.seal{width:56px;height:56px;border-radius:14px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem}
/* master statement */
.stmt th,.stmt td{white-space:nowrap}
.stmt tbody th{background:none;color:var(--fg);font-size:.88rem;text-align:start}
.stmt .neg{color:var(--bad);font-weight:600}
.stmt .pos{color:var(--ok);font-weight:600}
.viewer img{max-width:100%;border-radius:8px}
.viewer iframe{width:100%;height:70vh;border:1px solid var(--line);border-radius:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.slot{border:1px dashed var(--line);border-radius:10px;min-height:120px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;text-align:center;background:var(--bg)}
.slot.ok{border-style:solid;border-color:var(--ok)}
.slot img{width:100%;height:90px;object-fit:cover;border-radius:6px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  header.top,.noprint,.toolbar,.pager,.btn{display:none!important}
  body{background:#fff;color:#000;font-size:11px}
  .panel{border:1px solid #999;break-inside:avoid}
  main .wrap{padding:0;max-width:none}
  th{background:#eee!important;color:#000}
}
</style>
</head>
<body>

<!-- ============ شاشة الدخول ============ -->
<section class="login" id="loginView" hidden>
  <form class="panel card" id="fLogin" novalidate>
    <div class="row-flex" style="justify-content:space-between"><div class="seal">ح</div><div class="lang" data-lang-switch></div></div>
    <div><h1 data-t="appTitle"></h1><div class="sub" data-t="appSub"></div></div>
    <div class="field"><label for="loginCode" data-t="loginCode"></label><input id="loginCode" type="password" inputmode="numeric" autocomplete="current-password" required></div>
    <div class="err" id="loginErr" hidden></div>
    <button class="btn primary" type="submit" id="loginBtn" data-t="loginBtn"></button>
    <div id="apiBox" class="notice info" hidden style="display:flex;flex-direction:column;gap:8px">
      <strong data-t="apiTitle"></strong>
      <span class="small" data-t="apiHelp"></span>
      <input id="apiUrl" dir="ltr" placeholder="https://script.google.com/macros/s/…/exec" style="border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:.85rem;letter-spacing:0;text-align:left">
      <div class="row-flex"><button class="btn small primary" type="button" id="apiSave" data-t="apiSave"></button><span class="small" id="apiMsg"></span></div>
    </div>
    <button class="btn small" type="button" id="apiEdit" data-t="apiChange" style="align-self:center;border:0;background:none;color:var(--muted)" hidden></button>
  </form>
</section>

<!-- ============ التطبيق ============ -->
<div id="appView" hidden>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div><h1 data-t="appTitle"></h1><div class="sub"><span data-t="appSub"></span> · <span id="whoami"></span></div></div>
      <div class="row-flex">
        <div class="lang" data-lang-switch></div>
        <button class="btn small" type="button" id="btnRefresh" data-t="refresh"></button>
        <button class="btn small" type="button" id="btnLogout" data-t="logout"></button>
      </div>
    </div>
    <div class="row-flex" style="justify-content:space-between">
      <div class="chips" id="mosqueChips" role="group"></div>
      <div class="row-flex" id="quickAdd"></div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>
<main><div class="wrap" id="view"></div></main>
</div>

<!-- ============ نافذة المصروف ============ -->
<dialog id="dlgExp"><form id="fExp" novalidate>
  <h2 id="expTitle"></h2>
  <div class="notice info" id="expMode" hidden></div>
  <div class="fgrid">
    <div class="field req"><label for="e_mosque" data-t="mosque"></label><select id="e_mosque" data-lock></select></div>
    <div class="field req"><label for="e_date" data-t="date"></label><input id="e_date" type="date" data-lock></div>
    <div class="field req"><label for="e_cat" data-t="category"></label><select id="e_cat" data-lock></select></div>
    <div class="field"><label for="e_paidby" data-t="paidBy"></label><input id="e_paidby" list="people" data-lock></div>
    <div class="field req full"><label for="e_desc" data-t="desc"></label><input id="e_desc" data-lock></div>
    <div class="field"><label for="e_qty" data-t="qty"></label><input id="e_qty" inputmode="decimal" data-lock></div>
    <div class="field"><label for="e_price" data-t="unitPrice"></label><input id="e_price" inputmode="decimal" data-lock></div>
    <div class="field req full"><label for="e_total" data-t="totalTk"></label><input id="e_total" inputmode="decimal" data-lock><span class="hint" data-t="autoTotal"></span></div>
  </div>
  <fieldset class="box"><legend data-t="invoice"></legend>
    <div class="fgrid">
      <div class="field" id="invNoField"><label for="e_inv" data-t="invoiceNo"></label><input id="e_inv" data-inv></div>
      <div class="field"><label for="e_shop" data-t="shop"></label><input id="e_shop" list="shops" data-inv></div>
    </div>
    <label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="e_noinv" data-lock> <span data-t="noInvoice"></span></label>
    <div class="thumb" id="e_fileView"></div>
    <div class="field" id="e_uploadRow"><label for="e_file" data-t="invoiceImage"></label><input id="e_file" type="file" accept="image/*,application/pdf" data-inv><span class="hint" id="e_hint"></span></div>
  </fieldset>
  <div class="field"><label for="e_review" data-t="reviewNote"></label><input id="e_review" data-lock></div>
  <div class="small muted" id="expMeta"></div>
  <div class="err" id="expErr" hidden></div>
  <div class="actions"><div><button class="btn danger" type="button" id="expDel" data-t="delete"></button></div>
    <div class="r"><button class="btn" type="button" data-close data-t="cancel"></button><button class="btn primary" type="submit" id="expSave" data-t="save"></button></div></div>
</form></dialog>

<!-- ============ نافذة الدفعة المستلمة ============ -->
<dialog id="dlgRec"><form id="fRec" novalidate>
  <h2 id="recTitle"></h2>
  <div class="fgrid">
    <div class="field req"><label for="r_mosque" data-t="mosque"></label><select id="r_mosque"></select></div>
    <div class="field req"><label for="r_source" data-t="source"></label><select id="r_source"></select></div>
    <div class="field req"><label for="r_date" data-t="date"></label><input id="r_date" type="date"></div>
    <div class="field req"><label for="r_amount" data-t="amountTk"></label><input id="r_amount" inputmode="decimal"></div>
    <div class="field"><label for="r_who" data-t="receiver"></label><input id="r_who" list="people"></div>
    <div class="field"><label for="r_note" data-t="note"></label><input id="r_note"></div>
  </div>
  <fieldset class="box"><legend data-t="receiptDoc"></legend><div class="thumb" id="r_fileView"></div>
    <div class="field" id="r_uploadRow"><label for="r_file" data-t="invoiceImage"></label><input id="r_file" type="file" accept="image/*,application/pdf"></div></fieldset>
  <div class="err" id="recErr" hidden></div>
  <div class="actions"><div><button class="btn danger" type="button" id="recDel" data-t="delete"></button></div>
    <div class="r"><button class="btn" type="button" data-close data-t="cancel"></button><button class="btn primary" type="submit" id="recSave" data-t="save"></button></div></div>
</form></dialog>

<!-- ============ نافذة اتفاق المعلم ============ -->
<dialog id="dlgMis" class="wide"><form id="fMis" novalidate>
  <h2 id="misTitle"></h2>
  <div class="fgrid">
    <div class="field req"><label for="mi_mosque" data-t="mosque"></label><select id="mi_mosque"></select></div>
    <div class="field req"><label for="mi_type" data-t="workType"></label><select id="mi_type"></select></div>
    <div class="field"><label for="mi_name" data-t="mistryName"></label><input id="mi_name"></div>
    <div class="field"><label for="mi_phone" data-t="phone"></label><input id="mi_phone" inputmode="tel" dir="ltr"></div>
    <div class="field"><label for="mi_id" data-t="idNo"></label><input id="mi_id"></div>
    <div class="field req"><label for="mi_agreed" data-t="agreedTk"></label><input id="mi_agreed" inputmode="decimal"></div>
    <div class="field"><label for="mi_start" data-t="startDate"></label><input id="mi_start" type="date"></div>
    <div class="field"><label for="mi_end" data-t="endDate"></label><input id="mi_end" type="date"></div>
    <div class="field full"><label for="mi_scope" data-t="scope"></label><textarea id="mi_scope" rows="2"></textarea></div>
    <div class="field full"><label for="mi_notes" data-t="privateInfo"></label><textarea id="mi_notes" rows="2"></textarea></div>
  </div>
  <fieldset class="box"><legend data-t="mistryPayments"></legend>
    <div class="tscroll"><table class="inst"><thead><tr><th data-t="installment"></th><th data-t="planned"></th><th data-t="date"></th><th data-t="paidActual"></th><th data-t="status"></th><th data-t="note"></th><th></th></tr></thead><tbody id="instBody"></tbody>
    <tfoot><tr><td data-t="total"></td><td class="num" id="instPlanned"></td><td></td><td class="num" id="instPaid"></td><td colspan="3" class="small" id="instLeft"></td></tr></tfoot></table></div>
    <div class="row-flex" id="instBtns"><button class="btn" type="button" id="instAdd" data-t="addInstallment"></button><button class="btn" type="button" id="instSplit" data-t="splitRest"></button></div>
  </fieldset>
  <div class="err" id="misErr" hidden></div>
  <div class="actions"><div><button class="btn danger" type="button" id="misDel" data-t="delete"></button></div>
    <div class="r"><button class="btn" type="button" data-close data-t="cancel"></button><button class="btn primary" type="submit" id="misSave" data-t="save"></button></div></div>
</form></dialog>

<!-- ============ نافذة الملاحظة ============ -->
<dialog id="dlgNote"><form id="fNote" novalidate>
  <h2 id="noteTitle"></h2>
  <div class="fgrid">
    <div class="field"><label for="n_mosque" data-t="concerns"></label><select id="n_mosque"></select></div>
    <div class="field"><label for="n_kind" data-t="kind"></label><select id="n_kind"></select></div>
    <div class="field req full"><label for="n_title" data-t="title"></label><input id="n_title"></div>
    <div class="field full"><label for="n_body" data-t="details"></label><textarea id="n_body" rows="4"></textarea></div>
    <div class="field"><label for="n_date" data-t="date"></label><input id="n_date" type="date"></div>
    <div class="field"><label for="n_status" data-t="status"></label><select id="n_status"></select></div>
  </div>

function stats(n){
  const ex=[...S.exp.values()].filter(e=>!n||e.mosque==n),rc=[...S.rec.values()].filter(r=>!n||r.mosque==n);
  const sum=(a,f)=>a.reduce((s,x)=>s+N(x[f]),0);
  const spent=sum(ex,"total"),donor=sum(rc.filter(r=>r.source!=="council"),"amount"),council=sum(rc.filter(r=>r.source==="council"),"amount");
  const pur=ex.filter(isPur),purInv=pur.filter(hasInv);
  const budget=n?N(mObj(n)?.budget):S.mosques.reduce((a,m)=>a+N(m.budget),0);
  return {ex,rc,spent,donor,council,budget,balance:donor-spent,remaining:budget-donor,deficit:Math.max(0,spent-donor),pur:pur.length,purInv:purInv.length,purAmt:sum(pur,"total"),purInvAmt:sum(purInv,"total"),
    review:ex.filter(e=>e.review||S.dupMap.has(String(e.id))).length};
}
/* اكتشاف المكررات المحتملة */
function computeDupes(){
  const M=new Map(),add=(e,r)=>{const k=String(e.id);if(!M.has(k))M.set(k,[]);M.get(k).push(r)};
  const ex=[...S.exp.values()];
  const g=new Map();
  for(const e of ex){if(N(e.total)<500)continue;const k=[e.mosque,e.category,N(e.total),e.date].join("|");if(!g.has(k))g.set(k,[]);g.get(k).push(e)}
  for(const arr of g.values())if(arr.length>1){arr.sort((a,b)=>a.seq-b.seq);arr.slice(1).forEach(e=>add(e,{k:"dup_same",s:arr[0].seq,m:arr[0].mosque,ref:arr[0].id}))}
  const gi=new Map();
  for(const e of ex){const x=String(e.invoiceNo||"").trim();if(!x)continue;const k=x+"|"+(e.shop||"");if(!gi.has(k))gi.set(k,[]);gi.get(k).push(e)}
  for(const arr of gi.values())if(arr.length>1)arr.forEach(e=>{const o=arr.find(y=>y!==e);add(e,{k:"dup_inv",x:e.invoiceNo,s:o.seq,m:o.mosque,ref:o.id})});
  const gc=new Map();
  for(const e of ex){if(N(e.total)<5000||!isPur(e))continue;const k=[e.category,N(e.total),e.date].join("|");if(!gc.has(k))gc.set(k,[]);gc.get(k).push(e)}
  for(const arr of gc.values()){const ms=new Set(arr.map(e=>e.mosque));if(ms.size>1)arr.forEach(e=>{const o=arr.find(y=>y.mosque!==e.mosque);add(e,{k:"dup_cross",s:o.seq,m:o.mosque,ref:o.id})})}
  S.dupMap=M;
}

const EV={photos:[null,null,null,null,null],videos:[null,null],busy:0};
async function sha256(file){try{const b=await file.arrayBuffer();const h=await crypto.subtle.digest("SHA-256",b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(_){return file.name+file.size+file.lastModified}}
function evSlotHtml(kind,i){const s=EV[kind][i],lbl=t(kind==="photos"?"photoN":"videoN",{n:i+1});
  let body=`<span class="small muted">${t("tapToAdd")}</span>`;
  if(s&&s.state==="up")body=`<span class="small">${t("uploadPct",{p:s.pct||0})}</span><div class="bar" style="width:80%"><span style="width:${s.pct||0}%;background:var(--ink)"></span></div>`;
  if(s&&s.state==="err")body=`<span class="small" style="color:var(--bad)">${esc(s.msg)}</span>`;
  if(s&&s.state==="ok")body=kind==="photos"&&s.preview?`<img src="${s.preview}" alt="">`:`<span class="pill ok">✓ ${esc(s.file.name.slice(-24))}</span>`;
  return `<label class="slot ${s&&s.state==="ok"?"ok":""}" for="ev_${kind}_${i}"><b class="small">${lbl}</b>${body}
    <input type="file" id="ev_${kind}_${i}" data-k="${kind}" data-i="${i}" accept="${kind==="photos"?"image/*":"video/*"}" hidden>
    ${s&&s.state==="ok"?`<button type="button" class="btn small" data-rmslot="${kind}:${i}">${t("remove")}</button>`:""}</label>`}
function evNeedText(){const p=EV.photos.filter(s=>s&&s.state==="ok").length,v=EV.videos.filter(s=>s&&s.state==="ok").length;return {p:5-p,v:2-v}}
function drawSlots(){const w=$("#evSlots");if(!w)return;w.innerHTML=`<fieldset class="box"><legend>${t("evPhotos")}</legend><div class="slots">${EV.photos.map((_,i)=>evSlotHtml("photos",i)).join("")}</div></fieldset>
  <fieldset class="box"><legend>${t("evVideos")}</legend><div class="slots">${EV.videos.map((_,i)=>evSlotHtml("videos",i)).join("")}</div></fieldset>`;
  const n=evNeedText(),ok=n.p<=0&&n.v<=0&&!EV.busy;$("#evSave").disabled=!ok;$("#evNeed").textContent=ok?t("evReady"):t("evNeed",{p:Math.max(0,n.p),v:Math.max(0,n.v)});}
async function uploadVideo(file,onPct){
  try{const s=await api("videoSession",{name:file.name,mime:file.type||"video/mp4",size:file.size,origin:location.origin});
    const id=await new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open("PUT",s.uploadUrl);x.upload.onprogress=e=>{if(e.lengthComputable)onPct(Math.round(e.loaded/e.total*100))};
      x.onload=()=>{if(x.status>=200&&x.status<300){try{res(JSON.parse(x.responseText).id)}catch(e){rej(e)}}else rej(new Error("status "+x.status))};x.onerror=()=>rej(new Error("network"));x.send(file.slice(0,file.size,""))});
    return (await api("uploadDone",{id})).file;
  }catch(e){
    if(file.size<=28*1024*1024){onPct(50);const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(file)});
      return (await api("upload",{kind:"evidence",name:file.name,mime:file.type||"video/mp4",data})).file}
    throw e}
}
async function onSlotFile(input){
  const kind=input.dataset.k,i=+input.dataset.i,file=input.files[0];if(!file)return;input.value="";
  if(kind==="photos"&&!file.type.startsWith("image/")){EV[kind][i]={state:"err",msg:t("photo_type")};return drawSlots()}
  if(kind==="videos"&&!file.type.startsWith("video/")){EV[kind][i]={state:"err",msg:t("video_type")};return drawSlots()}
  const key=kind==="photos"?await sha256(file):file.name+"|"+file.size+"|"+file.lastModified;
  if(EV[kind].some((s,j)=>j!==i&&s&&s.key===key)){EV[kind][i]={state:"err",msg:t(kind==="photos"?"evDup":"evDupV")};return drawSlots()}
  const slot={state:"up",pct:0,key};EV[kind][i]=slot;EV.busy++;drawSlots();
  try{
    if(kind==="photos"){slot.pct=30;drawSlots();let f=file;
      if(f.size>1.2e6&&!/heic|heif/.test(f.type)){const img=await createImageBitmap(f).catch(()=>null);if(img){const sc=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));if(b)f=new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"})}}
      const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(f)});
      slot.file=(await api("upload",{kind:"evidence",name:f.name,mime:f.type,data})).file;slot.preview=URL.createObjectURL(f);}
    else slot.file=await uploadVideo(file,p=>{slot.pct=p;drawSlots()});
    slot.state="ok";
  }catch(e){slot.state="err";slot.msg=kind==="videos"?t("videoFail"):errText(e)}
  finally{EV.busy--;drawSlots()}
}
document.addEventListener("change",e=>{if(e.target.matches&&e.target.matches("input[data-k][data-i]"))onSlotFile(e.target)});
document.addEventListener("click",e=>{const b=e.target.closest("[data-rmslot]");if(!b)return;e.preventDefault();const[k,i]=b.dataset.rmslot.split(":");EV[k][+i]=null;drawSlots()});

    <div class="field"><label for="tr_note">${t("note")}</label><input id="tr_note"></div></div>
    <div class="err" id="trErr" hidden></div><div class="row-flex" style="justify-content:flex-end"><button class="btn primary" type="button" id="trSave">${t("trSubmit")}</button></div></section>`:""}
  <section class="panel"><div class="ph"><h2 class="sec-h">${t("tab_trips")}</h2><span class="small">${pend?`<span class="pill warn">${t("trPendingCount",{n:pend})}</span> `:""}${t("st_approved")}: <span class="num">${fmt(sum)}</span></span></div><div class="tscroll"><table><thead><tr><th>${t("date")}</th>${canReview||P("viewAll")?`<th>${t("staff")}</th>`:""}<th>${t("mosque")}</th><th>${t("fromPlace")} ← ${t("toPlace")}</th><th class="amt">${t("tripCost")}</th><th class="amt">${t("roundTrip")}</th><th class="amt">${t("food")}</th><th>${t("status")}</th>${canReview?"<th></th>":""}</tr></thead><tbody>
  ${list.map(x=>`<tr><td class="num">${esc(x.date)}</td>${canReview||P("viewAll")?`<td>${esc(x.staffName)}</td>`:""}<td>${esc(mosqueLabel(x))}</td><td>${esc([x.fromPlace,x.toPlace].filter(Boolean).join(" ← "))}${x.purpose?`<div class="small muted">${esc(x.purpose)}</div>`:""}</td><td class="amt num">${fmt(x.tripCost)}</td><td class="amt num" style="font-weight:600">${fmt(x.roundTrip)}</td><td class="amt num">${N(x.food)?fmt(x.food):"—"}</td><td>${trPill(x.status)}${x.reviewedBy?`<div class="small muted">${esc(x.reviewedBy)}</div>`:""}</td>
    ${canReview?`<td>${x.status==="pending"?`<div class="row-flex"><button class="btn small primary" type="button" data-trok="${esc(x.id)}">${t("approve")}</button><button class="btn small danger" type="button" data-trno="${esc(x.id)}">${t("reject")}</button></div>`:""}</td>`:""}</tr>`).join("")||`<tr><td colspan="9" class="empty">${t("trNone")}</td></tr>`}
  </tbody></table></div></section>`;
  if(canAdd){$("#tr_mosque").onchange=e=>{$("#tr_otherWrap").hidden=e.target.value!=="0"};$("#tr_cost").oninput=()=>{const c=N($("#tr_cost").value);$("#tr_round").value=c?fmt(c*2):""};
    $("#trSave").onclick=async()=>{const err=$("#trErr");err.hidden=true;const rec={date:$("#tr_date").value,mosque:+$("#tr_mosque").value,mosqueName:$("#tr_other").value.trim(),fromPlace:$("#tr_from").value.trim(),toPlace:$("#tr_to").value.trim(),purpose:$("#tr_purpose").value.trim(),tripCost:N($("#tr_cost").value),food:P("food")?N($("#tr_food").value):0,note:$("#tr_note").value.trim()};
      if(!rec.tripCost){showErr(err,t("cost_required"));return}$("#trSave").disabled=true;try{const r=await api("saveTrip",{record:rec});S.trips.set(String(r.record.id),r.record);toast(t("trSaved"));render()}catch(e){showErr(err,errText(e));$("#trSave").disabled=false}}}
  const review=async(id,ok,b)=>{b.disabled=true;try{const r=await api("reviewTrip",{id,approve:ok});S.trips.set(String(r.record.id),r.record);(r.expenses||[]).forEach(e=>e&&S.exp.set(String(e.id),e));computeDupes();toast(ok?t("trApproved"):t("trRejected"));render()}catch(e){toast(errText(e));b.disabled=false}};
  v.querySelectorAll("[data-trok]").forEach(b=>b.onclick=()=>review(b.dataset.trok,true,b));
  v.querySelectorAll("[data-trno]").forEach(b=>b.onclick=()=>review(b.dataset.trno,false,b));
}

/* التصدير */
async function doExport(btn){
  btn.disabled=true;toast(t("exporting"));
  try{const r=await api("exportXlsx");const bin=atob(r.data),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
    const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([a],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));l.download=r.file.name;document.body.appendChild(l);l.click();l.remove();
    S.lastExport=r.file;toast(t("exported"));render()}
  catch(e){toast(errText(e))}finally{btn.disabled=false}
}

/* ============================ البدء ============================ */
(async()=>{
  renderLang();
  const showApi=v=>{$("#apiBox").hidden=!v;$("#apiEdit").hidden=v||baked();$("#apiUrl").value=apiUrl()};
  showApi(!apiUrl());
  $("#apiEdit").onclick=()=>showApi(true);
  $("#apiSave").onclick=async()=>{const u=$("#apiUrl").value.trim(),m=$("#apiMsg");
    if(/googleusercontent/.test(u)){m.style.color="var(--bad)";m.textContent=t("apiEcho");return}
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){m.style.color="var(--bad)";m.textContent=t("apiBad");return}
    m.style.color="";m.textContent=t("apiChecking");
    try{const r=await fetch(u,{redirect:"follow"});const j=await r.json();if(!j.ok)throw 0;try{localStorage.setItem("apiUrl",u)}catch(_){}m.style.color="var(--ok)";m.textContent=t("apiOk");setTimeout(()=>showApi(false),900)}
    catch(e){m.style.color="var(--bad)";m.textContent=t("apiFail")}};
  try{S.token=localStorage.getItem("tok")}catch(_){}
  if(S.token){try{await boot();return}catch(_){}}
  $("#loginView").hidden=false;
})();
</script>
